<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#f9f7f3;--bg2:#f1ede6;--card:#fffdf9;--line:#e7e1d6;--text:#1f1d19;--muted:#6b665d;--accent:#1f6fb2;--accent-soft:rgba(31,111,178,.10);--chip:#e3eef8;--chip-text:#1f6fb2;--shadow:0 18px 40px rgba(31,29,25,.14)}
html[data-theme=dark]{--bg:#141c28;--bg2:#0f1620;--card:#1a2332;--line:#2a3648;--text:#e8eef5;--muted:#8a97a8;--accent:#5ab4e6;--accent-soft:rgba(90,180,230,.12);--chip:#22364d;--chip-text:#8fd0f5;--shadow:0 18px 40px rgba(0,0,0,.45)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:400px;overflow:hidden}
body{background:radial-gradient(900px 500px at 88% 10%,var(--accent-soft),transparent 60%),linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{display:flex;align-items:center;gap:56px;padding:0 72px;height:100%}
.icon{flex:none;width:184px;height:184px;filter:drop-shadow(0 16px 28px rgba(0,0,0,.28))}
.right{flex:1;min-width:0}
.brand{display:flex;align-items:baseline;gap:18px;margin-bottom:14px}
.word{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:40px;letter-spacing:-.01em}
.word b{color:var(--accent);font-weight:700}
.tag{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
.site{margin-left:auto;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;color:var(--muted)}
h1{font-size:46px;line-height:1.08;font-weight:800;letter-spacing:-.025em;margin-bottom:26px}
h1 span{color:var(--accent)}
.pill{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 22px;box-shadow:var(--shadow)}
.dot{width:12px;height:12px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 5px rgba(239,68,68,.18);flex:none}
.status{font-size:17px;color:var(--muted);font-weight:500;flex:none}
.text{font-size:24px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{margin-left:auto;flex:none;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;font-weight:700;color:var(--chip-text);background:var(--chip);border-radius:8px;padding:6px 10px}
</style></head><body>
<div class="wrap">
  <img class="icon" src="icon.png" alt="">
  <div class="right">
    <div class="brand"><div class="word">Voil<b>à</b></div><div class="tag">Real-time voice dictation for Mac</div><div class="site">voilapro.app</div></div>
    <h1>Say it in any mix of languages.<br><span>Voilà — it's typed.</span></h1>
    <div class="pill"><div class="dot"></div><div class="status">Listening…</div><div class="text">Let's merge the PR 今天下午, then déployer en prod.</div><div class="chip">Soniox</div></div>
  </div>
</div>
</body></html>
